# Pi time reference for the CODRIVE bench. Allow the two current Jetson addresses.
pool ntp.ubuntu.com iburst maxsources 2
pool 2.ubuntu.pool.ntp.org iburst maxsources 2
driftfile /var/lib/chrony/chrony.drift
makestep 0.001 3
rtcsync
allow 192.168.96.162/32
allow 192.168.98.254/32
logdir /var/log/chrony
