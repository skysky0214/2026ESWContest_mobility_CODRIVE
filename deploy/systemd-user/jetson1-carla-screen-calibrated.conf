# Fixed physical monitor recapture only. Restore 98-ground-input.conf by removing this drop-in.
[Service]
UnsetEnvironment=CODRIVE_FRONT_CALIBRATION CODRIVE_GROUND_CALIBRATION
ExecStart=
ExecStart=/home/one/ws/adas/.venv/bin/python -m codrive.apps.jetson_front --backend v4l2 --device-index 0 --width 3840 --height 2160 --fps 30 --pixel-format UYVY --camera-calibration /home/one/ws/ESW2026-main/config/camera/jetson-front-ox08bc-20261023.json --headless --debug-stream-port 8081 --lane-method ufld --lane-model /home/one/ws/adas/models/culane_res18.engine --lane-interval 2 --ground-calibration /home/one/ws/ESW2026-main/config/camera/physical-screen-ground-20261027.json --perception-profile /home/one/ws/ESW2026-main/config/camera/physical-screen-perception-20261027.json
StandardOutput=append:/tmp/codrive-physical-input-service.log
StandardError=append:/tmp/codrive-physical-input-service.log
