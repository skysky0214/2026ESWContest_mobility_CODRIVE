# Direct CARLA RGB demonstration; no physical lens/screen calibration.
[Service]
UnsetEnvironment=CODRIVE_FRONT_CALIBRATION CODRIVE_GROUND_CALIBRATION
ExecStart=
ExecStart=/home/one/ws/adas/.venv/bin/python -m codrive.apps.jetson_front --stream-url http://192.168.50.30:18082/frame.jpg --headless --debug-stream-port 8081 --lane-method ufld --lane-model /home/one/ws/adas/models/culane_res18.engine --lane-interval 2 --ground-calibration /home/one/ws/ESW2026-main/config/camera/carla-front-rgb-ground.json --perception-profile /home/one/ws/ESW2026-main/config/camera/carla-signal-perception-20261027.json
StandardOutput=append:/tmp/codrive-carla-demo-service.log
StandardError=append:/tmp/codrive-carla-demo-service.log
